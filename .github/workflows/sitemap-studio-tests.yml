name: Sitemap Studio regression tests

on:
  push:
    paths:
      - "SitemapStudio/PyAppName/py.26.09.21/theme/PyAppName_Basic/User/**"
      - ".github/workflows/sitemap-studio-tests.yml"
  pull_request:
    paths:
      - "SitemapStudio/PyAppName/py.26.09.21/theme/PyAppName_Basic/User/**"
      - ".github/workflows/sitemap-studio-tests.yml"
  workflow_dispatch:

jobs:
  windows-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SitemapStudio/PyAppName/py.26.09.21/theme/PyAppName_Basic/User
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SitemapStudio/PyAppName/py.26.09.21/theme/PyAppName_Basic/User/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q core py tests main.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
